name: Build D.A Maqam Analyzer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target DA_Maqam_Analyzer_VST3 --parallel 2
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DA_MAQAM_ANALYZER_Windows_x64_VST3
          path: build/DA_Maqam_Analyzer_artefacts/Release/VST3/*.vst3/**
          if-no-files-found: error
